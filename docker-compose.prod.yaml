# Backend em Docker, usando o Postgres do Supabase (frontend fica na Vercel).
# Uso: docker compose -f docker-compose.prod.yaml up -d --build
# Variáveis vêm de backend/.env
services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
    ports:
      - ${BACKEND_PORT:-3310}:3000
    volumes:
      - ./backend/public/:/usr/src/app/public/
      - ./backend/.wwebjs_auth/:/usr/src/app/.wwebjs_auth/
    restart: always
